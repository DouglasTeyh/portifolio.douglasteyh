<style>
#header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    min-height: 80px;
    background: rgba(5, 5, 5, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 0 10%;
    box-sizing: border-box;
    z-index: 1000;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    transition: all 0.3s ease;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 0;
}

.logo {
    display: flex;
    align-items: center;
    font-size: 1.3rem;
    font-weight: 800;
    color: #fff;
    height: 60px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.logo h2 {
    margin: 0;
    font-size: 1.3rem;
    background: linear-gradient(135deg, #ff0066, #7f00ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: all 0.3s ease;
}

.logo:hover h2 {
    filter: drop-shadow(0 0 10px rgba(255, 0, 102, 0.6));
    transform: scale(1.05);
}

.links-navbar ul {
    display: flex;
    flex-direction: row;
    gap: 2rem;
    list-style: none;
    margin: 0;
    padding: 0;
    align-items: center;
    height: 60px;
}

.links-navbar ul li {
    display: flex;
    align-items: center;
    height: 60px;
}

.links-navbar ul li a {    
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 25px;
    border-radius: 30px;
    font-weight: 700;
    text-decoration: none;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    background: rgba(255, 255, 255, 0.03);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.links-navbar ul li a:hover {
    background: #fff;
    color: #000;
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
}

/* Modificação específica para quando for o botão de orçamento destacado */
.links-navbar ul li a#orcamento-btn {
    border-color: rgba(255, 0, 102, 0.35);
    color: #ff0066;
}

.links-navbar ul li a#orcamento-btn:hover {
    background: #ff0066;
    color: #000;
    border-color: #ff0066;
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(255, 0, 102, 0.4);
}

@media (max-width: 768px) {
    #header {
        padding: 0 5%;
        min-height: 70px;
    }

    .navbar {
        flex-direction: row;
        justify-content: space-between;
    }

    .links-navbar ul {
        gap: 10px;
        height: auto;
    }

    .links-navbar ul li a {
        padding: 8px 18px;
        font-size: 0.8rem;
    }
}
</style>

<body>
<header id="header">
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='index.html'">
            <h2>@douglasteyh</h2>
        </div>
        <div class="links-navbar">
            <ul>
                <li><a id="orcamento-btn" href="orcamento.html">Fazer Orçamento</a></li>
            </ul>
        </div>
    </nav>
</header>
</body>
